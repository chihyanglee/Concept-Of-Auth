[project]
name = "auth-server"
version = "0.1.0"
description = "Educational Auth Server implementing OAuth 2.0, OIDC, and RBAC concepts"
authors = [
    {name = "Simon", email = "simon@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-cors>=4.0.0",
    "pyjwt>=2.8.0",
    "werkzeug>=3.0.0",
    "flasgger>=0.9.7",
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-flask>=1.3.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]


